<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#050816">
  <title>Наши билеты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tickets-page">
    <!-- Нажатие на билет открывает его отдельно, где изображение можно увеличить. -->
    <a class="ticket-link" href="images/билет1.png" target="_blank" rel="noopener">
      <img class="ticket-image" src="images/билет1.png" alt="Первый электронный билет в Московский планетарий" width="1333" height="945" decoding="async">
    </a>
    <a class="ticket-link" href="images/билет2.png" target="_blank" rel="noopener">
      <img class="ticket-image" src="images/билет2.png" alt="Второй электронный билет в Московский планетарий" width="1326" height="938" loading="lazy" decoding="async">
    </a>
  </main>
</body>
</html>
